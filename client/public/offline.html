<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>You're offline · Tectum</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
        font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #eceef2; background: #0b0d12;
        background-image: radial-gradient(34rem 28rem at 10% 5%, rgba(59,130,246,.2), transparent 70%), radial-gradient(30rem 26rem at 95% 15%, rgba(6,182,212,.15), transparent 70%);
      }
      @media (prefers-color-scheme: light) { body { color: #0e1116; background-color: #f6f7f9; } .card { background: rgba(255,255,255,.75) !important; border-color: rgba(15,40,90,.1) !important; } p { color: #475569 !important; } }
      .card { max-width: 420px; text-align: center; padding: 36px 28px; border-radius: 24px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(16px); }
      h1 { font-size: 24px; margin: 18px 0 8px; }
      p { margin: 0 0 22px; color: #94a3b8; line-height: 1.5; }
      .btn { display: inline-flex; align-items: center; text-decoration: none; min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; font: 600 15px Inter, system-ui, sans-serif; color: #fff; cursor: pointer; background: linear-gradient(135deg, #2563eb, #0e7490); }
      .btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" width="72" height="72" alt="Tectum" style="border-radius: 18px" />
      <h1>You're offline</h1>
      <p>Tectum needs an internet connection to load cases and discussions. Check your Wi-Fi or mobile data and try again.</p>
      <a class="btn" href="/home">Try again</a>
    </main>
  </body>
</html>
